/* ===== ICON KONEKSI ===== */
.conn-icon{
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:7px;
    background:#11111a;border:1px solid #242431;
    flex-shrink:0;cursor:default;position:relative;
    transition:border-color .3s, background .3s;
}
.conn-icon svg{width:13px;height:13px;display:block}
.conn-icon.loading svg{stroke:#f59e0b}
.conn-icon.loading{border-color:#3b2e10}
.conn-icon.ok svg{stroke:#22c55e}
.conn-icon.ok{border-color:#14532d}
.conn-icon.ok::after{
    content:"";position:absolute;inset:-2px;border-radius:9px;
    border:1px solid #22c55e;opacity:.6;
    animation:pulseRing 1.6s ease-out infinite;
}
@keyframes pulseRing{
    0%{transform:scale(.9);opacity:.7}
    70%{transform:scale(1.25);opacity:0}
    100%{transform:scale(1.25);opacity:0}
}
.conn-icon.err svg{stroke:#ef4444}
.conn-icon.err{border-color:#7f1d1d}

/* ===== TOMBOL ===== */
.header-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn{
    border:1px solid #292938;background:#15151f;color:#eee;
    padding:5px 9px;border-radius:7px;font-size:10px;
}
.btn:hover{background:#1d1d2a}
.btn-primary{border:0;background:#7c3aed;color:#fff}
.btn-primary:hover{background:#6d28d9}
.btn-danger{color:#ff7373}
.btn-warning{color:#fbbf24;border-color:#3b2e10}
.btn-warning:hover{background:#1d1a10}

/* Tombol icon khusus */
.icon-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid #292938;
    background:#15151f;
    color:#fbbf24;
    border-radius:7px;
    font-size:13px;
    line-height:1;
    transition:background .2s, border-color .2s, transform .1s;
}
.icon-action:hover{background:#1d1a10;border-color:#3b2e10}
.icon-action:active{transform:scale(.92)}

/* =========================================================
   MENU TITIK 3 (⋮)
   ========================================================= */
.menu-wrap{position:relative;display:inline-block}
.menu-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid #292938;
    background:#15151f;
    color:#eee;
    border-radius:7px;
    font-size:15px;
    line-height:1;
    transition:background .2s, border-color .2s, transform .1s;
}
.menu-btn:hover{background:#1d1d2a;border-color:#3a3a4a}
.menu-btn:active{transform:scale(.92)}

.menu-dropdown{
    display:none;
    position:absolute;
    top:34px;
    right:0;
    min-width:220px;
    background:#13131c;
    border:1px solid #2a2a38;
    border-radius:9px;
    box-shadow:0 12px 40px rgba(0,0,0,.7);
    padding:6px;
    z-index:50;
}
.menu-dropdown.show{display:block}

.menu-section{
    padding:4px 6px 6px;
    font-size:9px;
    color:#70707e;
    letter-spacing:.5px;
    text-transform:uppercase;
    font-weight:700;
}
.menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    border:0;
    background:transparent;
    color:#e5e5ea;
    padding:8px 9px;
    border-radius:6px;
    font-size:11px;
    text-align:left;
    transition:background .15s, color .15s;
}
.menu-item:hover{background:#1d1d2a;color:#fff}
.menu-item.active{
    background:#1e1b33;
    color:#c4b5fd;
    font-weight:700;
}
.menu-item .flag{font-size:15px;line-height:1}
.menu-item .check{
    margin-left:auto;
    color:#22c55e;
    font-size:11px;
    font-weight:700;
}
.menu-divider{
    height:1px;
    background:#232330;
    margin:4px 2px;
}

/* ===== STATS ===== */
.stats{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:5px;margin-bottom:8px;
}
.stat{
    background:#11111a;border:1px solid #232330;
    border-radius:8px;padding:6px 8px;
}
.stat .label{color:#858594;font-size:8px;letter-spacing:.4px}
.stat .value{font-size:13px;font-weight:800;margin-top:1px}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.search{flex:1;min-width:120px}
.input{
    width:100%;background:#101019;color:#fff;
    border:1px solid #292938;outline:none;
    padding:6px 9px;border-radius:7px;font-size:10px;
}
.input:focus{border-color:#7c3aed}

/* =========================================================
   FOLDER LIST (3 KOLOM)
   ========================================================= */
.folders-grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:10px;
}

.folder-card{
    position:relative;
    background:#11111a;
    border:1px solid #252532;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .1s;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
}
.folder-card:hover{
    border-color:#7c3aed;
    background:#14141f;
}
.folder-card:active{transform:scale(.985)}

.folder-status{
    position:absolute;
    top:10px;
    right:10px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#3a3a4a;
    box-shadow:0 0 0 2px rgba(0,0,0,.35);
    transition:background .3s, box-shadow .3s;
    z-index:2;
}
.folder-status.running{
    background:#22c55e;
    box-shadow:0 0 0 2px rgba(0,0,0,.35),
                0 0 6px rgba(34,197,94,.85);
}
.folder-status.expired{
    background:#ef4444;
    box-shadow:0 0 0 2px rgba(0,0,0,.35),
                0 0 6px rgba(239,68,68,.85);
}
.folder-status.warning{
    background:#f59e0b;
    box-shadow:0 0 0 2px rgba(0,0,0,.35),
                0 0 6px rgba(245,158,11,.85);
    animation:folderWarnBlink 1.2s ease-in-out infinite;
}
@keyframes folderWarnBlink{
    0%,100%{opacity:1; transform:scale(1)}
    50%    {opacity:.35; transform:scale(.85)}
}

.folder-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    min-width:0;
    padding-right:14px;
}
.folder-icon{font-size:20px;line-height:1;flex-shrink:0}
.folder-name{
    font-weight:700;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    flex:1;
}

.folder-body{
    font-size:10px;
    color:#8d8d9b;
    line-height:1.4;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
}

/* ===== TAG SERVER DI FOLDER ===== */
.folder-server-tag{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:8px;
    padding:1px 5px;
    border-radius:999px;
    background:#1a1a24;
    color:#a1a1aa;
    font-weight:700;
    letter-spacing:.3px;
}
.folder-server-tag.en{background:#0c1a2e;color:#60a5fa}
.folder-server-tag.id{background:#1a0f0a;color:#fb923c}

/* ===== ACTION FOLDER (3 TOMBOL) ===== */
.folder-actions-3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
    margin-top:auto;
}
.folder-actions-3 .btn{
    padding:5px 3px;
    font-size:9px;
    text-align:center;
}
.btn-move{
    color:#67e8f9;
    border-color:#164e63;
    background:#0a1a20;
}
.btn-move:hover{background:#0e2430;border-color:#0891b2}

.add-folder-card{
    background:#0c0c13;
    border:1px dashed #3a3a4a;
    border-radius:10px;
    padding:20px 12px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
    color:#a1a1aa;
    font-size:11px;
    min-height:120px;
}
.add-folder-card:hover{
    border-color:#7c3aed;
    color:#c4b5fd;
    background:#11111a;
}
.add-folder-card .plus{font-size:24px;line-height:1}

/* ===== EMPTY STATE ===== */
.empty-folder-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:#0c0c13;
    border:1px dashed #2a2a38;
    border-radius:10px;
    color:#a1a1aa;
}
.empty-folder-state .icon{
    font-size:38px;
    margin-bottom:10px;
    line-height:1;
}
.empty-folder-state .title{
    font-size:13px;
    color:#e5e5ea;
    font-weight:600;
    margin-bottom:6px;
}
.empty-folder-state .desc{
    font-size:11px;
    color:#8d8d9b;
    margin-bottom:14px;
}

/* =========================================================
   USER CARDS (3 KOLOM)
   ========================================================= */
.folder-view-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    border:1px solid #292938;
    background:#15151f;
    color:#eee;
    padding:5px 10px;
    border-radius:7px;
    font-size:11px;
}
.back-btn:hover{background:#1d1d2a}
.folder-title{
    font-weight:700;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
}
.folder-badge{
    font-size:9px;
    padding:2px 6px;
    border-radius:999px;
    background:#123c27;
    color:#4ade80;
    font-weight:700;
    letter-spacing:.4px;
}
.folder-badge.full{
    background:#3b2e10;
    color:#fbbf24;
}
.folder-view-actions{
    margin-left:auto;
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:8px;
}

.card{
    background:#11111a;
    border:1px solid #252532;
    border-radius:9px;
    padding:9px;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
    height:100%;

<script>
/* =========================================================
   KONSTANTA
   ========================================================= */

const SECONDS_PER_DAY = 86400;
const MAX_USERS_PER_FOLDER = 6;
const WARNING_THRESHOLD_SECONDS = 4 * 3600;

const SERVER_KEY = "udm_active_server";


/* =========================================================
   JSONBIN CONFIG
   ========================================================= */

const JSONBIN_BIN_ID = "6aace851ac6210605adb62a2";
const JSONBIN_MASTER_KEY = "$2a$10$U/vFMM2oNl9JCMpH50XJi.xZvGbSxy.vL6xwgoN7pVIH1antwH0Xm";
const JSONBIN_BASE = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;


/* =========================================================
   STATE
   ========================================================= */

let folders = [];
let users = [];
let activeFolderId = null;

/* Baca server aktif dengan aman */
let activeServer = "id";
try {
    const saved = localStorage.getItem(SERVER_KEY);
    if (saved === "en" || saved === "id") activeServer = saved;
} catch (e) {
    activeServer = "id";
}

let loading = false;
const revealedPasswords = new Set();
let tickInterval = null;


/* =========================================================
   JSONBIN
   ========================================================= */

function jsonbinHeaders() {
    return {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_MASTER_KEY
    };
}

async function apiLoad() {

    if (!JSONBIN_BIN_ID || !JSONBIN_MASTER_KEY ||
        JSONBIN_MASTER_KEY === "ISI_MASTER_KEY_DI_SINI") {
        throw new Error("Master Key belum diisi di JSONBIN_MASTER_KEY.");
    }

    const response = await fetch(
        JSONBIN_BASE + "/latest?meta=false",
        {
            method: "GET",
            headers: { "X-Master-Key": JSONBIN_MASTER_KEY },
            cache: "no-store"
        }
    );

    const text = await response.text();

    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error("Response JSONBin tidak valid: " + text); }

    if (!response.ok) {
        throw new Error(data.message || ("HTTP " + response.status));
    }

    if (data && typeof data === "object" &&
        Array.isArray(data.users) && Array.isArray(data.folders)) {
        return { folders: data.folders, users: data.users };
    }

    if (Array.isArray(data)) {
        const defaultFolder = {
            id: "f_default_" + Date.now().toString(36),
            name: "Folder 1",
            lang: "id",
            createdAt: new Date().toISOString()
        };
        const migrated = data.map(u => ({
            ...u,
            folderId: u.folderId || defaultFolder.id
        }));
        return { folders: [defaultFolder], users: migrated };
    }

    if (data && Array.isArray(data.users)) {
        const defaultFolder = {
            id: "f_default_" + Date.now().toString(36),
            name: "Folder 1",
            lang: "id",
            createdAt: new Date().toISOString()
        };
        const migrated = data.users.map(u => ({
            ...u,
            folderId: u.folderId || defaultFolder.id
        }));
        return { folders: [defaultFolder], users: migrated };
    }

    return { folders: [], users: [] };
}

async function apiSave(dataObj) {

    if (!JSONBIN_BIN_ID || !JSONBIN_MASTER_KEY ||
        JSONBIN_MASTER_KEY === "ISI_MASTER_KEY_DI_SINI") {
        throw new Error("Master Key belum diisi di JSONBIN_MASTER_KEY.");
    }

    const response = await fetch(
        JSONBIN_BASE,
        {
            method: "PUT",
            headers: jsonbinHeaders(),
            body: JSON.stringify({
                folders: dataObj.folders,
                users: dataObj.users
            })
        }
    );

    const text = await response.text();

    let data = {};
    try { data = JSON.parse(text); } catch {}

    if (!response.ok) {
        throw new Error(
            data.message ||
            ("HTTP " + response.status + ": " + text)
        );
    }

    return data;
}


/* =========================================================
   LOAD
   ========================================================= */

async function loadData() {

    if (loading) return;
    loading = true;
    setConnStatus("loading");

    try {
        const payload = await apiLoad();
        folders = Array.isArray(payload.folders) ? payload.folders : [];
        users   = Array.isArray(payload.users)   ? payload.users   : [];

        /* Normalisasi folder — pastikan semua punya lang */
        folders = folders.map((f, i) => {
            if (!f || typeof f !== "object") f = {};
            if (!f.id) f.id = "f_" + Date.now() + "_" + i;
            if (!f.name) f.name = "Folder " + (i + 1);
            /* Semua yang bukan 'en' dianggap 'id' */
            f.lang = (f.lang === "en") ? "en" : "id";
            if (!f.createdAt) f.createdAt = new Date().toISOString();
            return f;
        });

        normalizeUsers();

        /* Pastikan semua user punya folderId valid */
        const validFolderIds = new Set(folders.map(f => f.id));
        if (validFolderIds.size === 0) {
            folders.push({
                id: "f_default_" + Date.now().toString(36),
                name: "Folder 1",
                lang: "id",
                createdAt: new Date().toISOString()
            });
            validFolderIds.add(folders[0].id);
        }
        const fallbackId = folders[0].id;
        users.forEach(u => {
            if (!u.folderId || !validFolderIds.has(u.folderId)) {
                u.folderId = fallbackId;
            }
        });

        if (activeFolderId && !folders.find(f => f.id === activeFolderId)) {
            activeFolderId = null;
        }

        updateServerMenu();

        if (activeFolderId) {
            document.getElementById("folderView").style.display = "none";
            document.getElementById("userView").style.display = "block";
            const f = folders.find(x => x.id === activeFolderId);
            if (f) {
                document.getElementById("currentFolderIcon").textContent = "📁";
                document.getElementById("currentFolderName").textContent = f.name;
            }
            render();
        } else {
            showFolderList();
        }

        setConnStatus("ok");

    } catch (error) {
        console.error(error);
        folders = [];
        users = [];
        activeFolderId = null;
        showFolderList();
        setConnStatus("err");
        showToast("Gagal memuat: " + error.message, "error");
    } finally {
        loading = false;
    }
}


function normalizeUsers() {

    users = users.map((u, index) => {

        if (!u || typeof u !== "object") u = {};

        if (!u.id) u.id = "u_" + Date.now() + "_" + index;
        if (!u.folderId) u.folderId = "";

        if (!u.email)    u.email    = "";
        if (!u.password) u.password = "";
        if (!u.inValue)  u.inValue  = "";

        if (typeof u.followers !== "number") {
            u.followers = Number(u.followers) || 0;
        }

        if (!u.name)     u.name = u.deviceId || "";
        if (!u.deviceId) u.deviceId = "";

        if (!u.timer || typeof u.timer !== "object") u.timer = {};

        const t = u.timer;

        let durationSeconds = Number(t.durationSeconds);
        if (!durationSeconds || durationSeconds < 1) {
            let durationDays = Number(t.durationDays) || 1;
            durationSeconds = durationDays * SECONDS_PER_DAY;
        }

        t.durationSeconds = durationSeconds;
        t.durationDays = durationSeconds / SECONDS_PER_DAY;

        let remainingSeconds = Number(t.remainingSeconds);
        if (!Number.isFinite(remainingSeconds) || remainingSeconds < 0) {
            if (typeof t.remainingMs === "number" && t.remainingMs >= 0) {
                remainingSeconds = Math.floor(t.remainingMs / 1000);
            } else {
                remainingSeconds = durationSeconds;
            }
        }
        t.remainingSeconds = remainingSeconds;
        t.remainingMs = remainingSeconds * 1000;

        t.endAt     = t.endAt || null;
        t.startedAt = t.startedAt || null;
        t.status    = t.status || "idle";

        if (t.status === "running" && !t.endAt) t.status = "idle";

        if (t.status === "running" && t.endAt) {
            if (new Date(t.endAt).getTime() <= Date.now()) {
                t.status = "expired";
                t.endAt = null;
                t.remainingSeconds = 0;
                t.remainingMs = 0;
            }
        }

        return u;
    });
}

/* =========================================================
   STATUS FOLDER
   ========================================================= */

function getFolderStatus(folderId) {

    const list = users.filter(u => u.folderId === folderId);

    if (list.length === 0) {
        return { cls: "", label: "Kosong", text: "Folder kosong" };
    }

    let hasExpired = false;
    let hasWarning = false;
    let hasRunning = false;
    let runningCount = 0;
    let expiredCount = 0;
    let warningCount = 0;

    list.forEach(u => {
        const s = getStatus(u);
        const remain = getRemainingSeconds(u);

        if (s === "expired") {
            hasExpired = true;
            expiredCount++;
        } else if (s === "running") {
            runningCount++;
            hasRunning = true;
            if (remain <= WARNING_THRESHOLD_SECONDS) {
                hasWarning = true;
                warningCount++;
            }
        }
    });

    if (hasExpired) {
        return { cls: "expired", label: "Expired", text: expiredCount + " user expired" };
    }
    if (hasWarning) {
        return { cls: "warning", label: "Warning", text: warningCount + " user hampir habis" };
    }
    if (hasRunning) {
        return { cls: "running", label: "Running", text: runningCount + " user running" };
    }

    return { cls: "", label: "Idle", text: "Tidak ada user running" };
}

/* =========================================================
   RENDER USER DI DALAM FOLDER
   ========================================================= */

function render() {

    const grid = document.getElementById("grid");
    if (!activeFolderId) { grid.innerHTML = ""; return; }

    const search = (document.getElementById("search")?.value || "")
        .toLowerCase().trim();
    const filter = document.getElementById("filter")?.value || "all";

    const folderUsers = users.filter(u => u.folderId === activeFolderId);

    let filtered = folderUsers.filter(u => {
        const status = getStatus(u);
        const text = (
            u.email + " " +
            (u.name || u.deviceId || "") + " " +
            (u.inValue || "") + " " +
            u.id
        ).toLowerCase();

        const matchesSearch = !search || text.includes(search);
        const matchesFilter = filter === "all" || status === filter;

        return matchesSearch && matchesFilter;
    });

    filtered.sort((a, b) => {
        const sa = getStatus(a);
        const sb = getStatus(b);
        if (sa === "running" && sb === "running") {
            return getRemainingSeconds(a) - getRemainingSeconds(b);
        }
        if (sa === "running") return -1;
        if (sb === "running") return 1;
        return 0;
    });

    const f = folders.find(x => x.id === activeFolderId);
    if (f) {
        const count = folderUsers.length;
        const badge = document.getElementById("currentFolderBadge");
        if (badge) {
            badge.textContent = count + "/" + MAX_USERS_PER_FOLDER;
            badge.classList.toggle("full", count >= MAX_USERS_PER_FOLDER);
        }
    }

    if (!filtered.length) {
        grid.innerHTML = `<div class="empty">Belum ada user di folder ini</div>`;
    } else {
        grid.innerHTML = filtered.map(renderCard).join("");
    }

    updateStats();
}


function renderCard(u) {

    const status = getStatus(u);
    const remainingSec = getRemainingSeconds(u);

    const nameValue = u.name || u.deviceId || "-";
    const inValue   = u.inValue || "-";

    const totalSec = Number(u.timer.durationSeconds) || SECONDS_PER_DAY;
    let pct = totalSec > 0
        ? Math.max(0, Math.min(1, remainingSec / totalSec))
        : 0;
    if (status === "expired" || remainingSec <= 0) pct = 0;

    const RADIUS = 30;
    const CIRC   = 2 * Math.PI * RADIUS;
    const offset = CIRC * (1 - pct);

    let ringClass = "red";
    if (status === "expired" || remainingSec <= 0) {
        ringClass = "dead";
    } else if (remainingSec > 43200) {
        ringClass = "green";
    } else if (remainingSec > 14400) {
        ringClass = "orange";
    } else {
        ringClass = "red";
    }

    const timeStr = formatHHMMSS(remainingSec);
    const durationLabel = formatDurationLabel(u.timer.durationDays);

    const pwRevealed = revealedPasswords.has(u.id);
    const pwDisplay  = pwRevealed
        ? escapeHtml(u.password || "")
        : "••••••••";

    return `
        <div class="card">

            <div class="card-head">
                <div style="min-width:0;flex:1">
                    <div class="info-row">
                        <span class="k">Email</span>
                        <span class="v">: ${escapeHtml(u.email || "-")}</span>
                        <button class="icon-btn"
                                onclick="copyText('${escapeAttr(u.email || "")}', this)">Copy</button>
                    </div>
                    <div class="info-row" style="margin-top:3px">
                        <span class="k">Password</span>
                        <span class="v pw">: ${pwDisplay}</span>
                        <button class="icon-btn"
                                onclick="toggleReveal('${u.id}')">${pwRevealed ? "🙈" : "👁"}</button>
                        <button class="icon-btn"
                                onclick="copyText('${escapeAttr(u.password || "")}', this)">Copy</button>
                    </div>
                    <div class="info-row" style="margin-top:3px">
                        <span class="k k-in">IN</span>
                        <span class="v v-in">: ${escapeHtml(inValue)}</span>
                    </div>
                </div>
                <span class="badge ${status}">${status.toUpperCase()}</span>
            </div>

            <div class="info">
                <div class="info-row">
                    <span class="k">Follow</span>
                    <span class="v">: ${formatNumber(u.followers)}</span>
                </div>
                <div class="info-row">
                    <span class="k">Name</span>
                    <span class="v">: ${escapeHtml(nameValue)}</span>
                </div>
            </div>

            <div class="timer-ring">
                <div class="ring-wrap">
                    <svg viewBox="0 0 72 72">
                        <circle class="ring-bg" cx="36" cy="36" r="${RADIUS}"></circle>
                        <circle class="ring-fg ${ringClass}" cx="36" cy="36" r="${RADIUS}"
                                stroke-dasharray="${CIRC.toFixed(2)}"
                                stroke-dashoffset="${offset.toFixed(2)}"></circle>
                    </svg>
                    <div class="ring-text">${timeStr}</div>
                </div>
                <div class="timer-label">${durationLabel}</div>
            </div>

            <div class="card-actions">
                ${
                    status === "running"
                    ? `<button class="btn" onclick="pauseTimer('${u.id}')">Pause</button>`
                    : `<button class="btn" onclick="startTimer('${u.id}')">Start</button>`
                }
                <button class="btn" onclick="editUser('${u.id}')">Edit</button>
                <button class="btn btn-danger" onclick="askDeleteUser('${u.id}')">Hapus</button>
            </div>

        </div>
    `;
}


/* =========================================================
   TIMER
   ========================================================= */

function getStatus(u) {
    if (!u.timer) return "idle";
    if (u.timer.status === "running" && u.timer.endAt) {
        if (Date.now() >= new Date(u.timer.endAt).getTime()) return "expired";
    }
    return u.timer.status || "idle";
}

function getRemainingSeconds(u) {
    if (!u.timer) return 0;
    if (u.timer.status === "running" && u.timer.endAt) {
        const remainMs = new Date(u.timer.endAt).getTime() - Date.now();
        return Math.max(0, Math.floor(remainMs / 1000));
    }
    return Math.max(0, Math.floor(Number(u.timer.remainingSeconds) || 0));
}


async function startTimer(id) {

    const u = users.find(x => x.id === id);
    if (!u) return;

    if (u.timer.status === "running" && u.timer.endAt) return;

    let remainingSec = getRemainingSeconds(u);
    if (remainingSec <= 0) {
        remainingSec = Number(u.timer.durationSeconds) || SECONDS_PER_DAY;
    }

    u.timer.status = "running";
    u.timer.remainingSeconds = remainingSec;
    u.timer.remainingMs = remainingSec * 1000;
    u.timer.startedAt = new Date().toISOString();
    u.timer.endAt = new Date(Date.now() + remainingSec * 1000).toISOString();

    render();
    await saveData(false);
}

async function pauseTimer(id) {

    const u = users.find(x => x.id === id);
    if (!u) return;

    const remainingSec = getRemainingSeconds(u);

    u.timer.status = "paused";
    u.timer.remainingSeconds = remainingSec;
    u.timer.remainingMs = remainingSec * 1000;
    u.timer.endAt = null;

    render();
    await saveData(false);
}


/* =========================================================
   TIMER LOOP
   ========================================================= */

function startTickLoop() {

    if (tickInterval) return;

    tickInterval = setInterval(async () => {

        let changed = false;

        for (const u of users) {
            if (u.timer && u.timer.status === "running" && u.timer.endAt) {
                const remainMs = new Date(u.timer.endAt).getTime() - Date.now();
                if (remainMs <= 0) {
                    u.timer.status = "expired";
                    u.timer.remainingSeconds = 0;
                    u.timer.remainingMs = 0;
                    u.timer.endAt = null;
                    changed = true;
                } else {
                    u.timer.remainingSeconds = Math.floor(remainMs / 1000);
                    u.timer.remainingMs = remainMs;
                }
            }
        }

        if (activeFolderId) render();
        else renderFolders();
        updateStats();

        if (changed) await saveData(false);

    }, 1000);
}


/* =========================================================
   RESET JAM — hanya server aktif
   ========================================================= */

function menuReset() {

function askResetAllTimers() {

    const activeFolderIds = new Set(
        folders.filter(f => (f.lang === "en" ? "en" : "id") === activeServer)
               .map(f => f.id)
    );
    const target = users.filter(u => activeFolderIds.has(u.folderId));

        return;
    }

    document.getElementById("resetTitle").textContent = "Reset Semua Jam?";
    document.getElementById("resetText").textContent =
        "Semua timer (" + target.length + " user) di server " +
        (activeServer === "en" ? "US 🇺🇸" : "Indonesia 🇮🇩") +
        " akan direset ke durasi awal (idle). Data user lain tidak dihapus.";

    document.getElementById("resetModal").classList.add("show");
}

function closeReset() {
    document.getElementById("resetModal").classList.remove("show");
}

async function confirmReset() {

    const activeFolderIds = new Set(
        folders.filter(f => (f.lang === "en" ? "en" : "id") === activeServer)
               .map(f => f.id)
    );

    const target = users.filter(u => activeFolderIds.has(u.folderId));

    if (!target.length) {
        closeReset();
        return;
    }

    target.forEach(u => {
        const durationSeconds =
            Number(u.timer?.durationSeconds) ||
            (Number(u.timer?.durationDays) || 1) * SECONDS_PER_DAY;

        u.timer = u.timer || {};
        u.timer.durationSeconds  = durationSeconds;
        u.timer.durationDays     = durationSeconds / SECONDS_PER_DAY;
        u.timer.remainingSeconds = durationSeconds;
        u.timer.remainingMs      = durationSeconds * 1000;
        u.timer.endAt            = null;
        u.timer.startedAt        = null;
        u.timer.status           = "idle";
    });

    closeReset();

    if (activeFolderId) render();
    else renderFolders();
    updateStats();

    showToast("Timer di server ini direset ke durasi awal", "success");
    await saveData(false);
}

async function saveFolder() {

    const id = document.getElementById("folderEditId").value;
    const name = document.getElementById("folderName").value.trim();

    if (!name) {
        showToast("Nama folder wajib diisi", "error");
        return;
    }

    if (id) {
        const f = folders.find(x => x.id === id);
        if (f) {
            f.name = name;
            /* Pastikan tetap punya lang yang benar */
            f.lang = (f.lang === "en") ? "en" : "id";
        }
    } else {
        folders.push({
            id: "f_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
            name: name,
            lang: activeServer,
            createdAt: new Date().toISOString()
        });
    }

    closeFolderModal();
    renderFolders();
    updateStats();
    await saveData();
}

function askDeleteFolder(id) {
    const f = folders.find(x => x.id === id);
    if (!f) return;

    const count = users.filter(u => u.folderId === id).length;

    document.getElementById("deleteTitle").textContent = "Hapus Folder?";
    document.getElementById("deleteText").textContent =
        "Folder \"" + f.name + "\" akan dihapus" +
        (count > 0
            ? " bersama " + count + " user di dalamnya."
            : ".");
    document.getElementById("deleteId").value = id;
    document.getElementById("deleteType").value = "folder";
    document.getElementById("deleteModal").classList.add("show");
}

async function deleteFolder(id) {
    folders = folders.filter(f => f.id !== id);
    users = users.filter(u => u.folderId !== id);

    if (activeFolderId === id) activeFolderId = null;

    showFolderList();
    await saveData();
}


/* =========================================================
   PINDAH FOLDER KE SERVER LAIN
   ========================================================= */

let pendingMoveFolderId = null;

function askMoveFolder(id) {

    const f = folders.find(x => x.id === id);
    if (!f) return;

    const currentLang = (f.lang === "en") ? "en" : "id";
    const targetLang  = (currentLang === "en") ? "id" : "en";
    const targetName  = (targetLang === "en") ? "Server US 🇺🇸" : "Server Indonesia 🇮🇩";
    const currentName = (currentLang === "en") ? "Server US 🇺🇸" : "Server Indonesia 🇮🇩";

    /* Cek apakah sudah ada folder dengan nama sama di server tujuan */
    const duplicate = folders.find(x =>
        x.id !== id &&
        (x.lang === "en" ? "en" : "id") === targetLang &&
        x.name.trim().toLowerCase() === f.name.trim().toLowerCase()
    );

    if (duplicate) {
        showToast("Sudah ada folder dengan nama sama di " + targetName, "error");
        return;
    }

    const count = users.filter(u => u.folderId === id).length;

    pendingMoveFolderId = id;

    document.getElementById("moveFolderTitle").textContent = "Pindahkan Folder?";
    document.getElementById("moveFolderText").innerHTML =
        "Folder <b>" + escapeHtml(f.name) + "</b> (" + count + " user) akan dipindahkan dari " +
        currentName + " ke <b>" + targetName + "</b>.<br><br>" +
        "Semua user di dalamnya akan ikut pindah. Timer tetap berjalan normal.";

    document.getElementById("moveFolderModal").classList.add("show");
}

function closeMoveFolder() {
    pendingMoveFolderId = null;
    document.getElementById("moveFolderModal").classList.remove("show");
}

async function confirmMoveFolder() {

    const id = pendingMoveFolderId;
    if (!id) { closeMoveFolder(); return; }

    const f = folders.find(x => x.id === id);
    if (!f) { closeMoveFolder(); return; }

    const currentLang = (f.lang === "en") ? "en" : "id";
    const targetLang  = (currentLang === "en") ? "id" : "en";

    f.lang = targetLang;

    closeMoveFolder();

    if (activeFolderId === id) {
        /* Kalau folder yang sedang dibuka dipindah, kembali ke daftar folder */
        activeFolderId = null;
    }

    renderFolders();
    updateStats();

    const targetName = (targetLang === "en") ? "Server US 🇺🇸" : "Server Indonesia 🇮🇩";
    showToast("Folder dipindahkan ke " + targetName, "success");

    await saveData(false);
}


/* =========================================================
   USER — ADD / EDIT / DELETE
   ========================================================= */

function refreshFolderSelect(selectedId) {

    const sel = document.getElementById("userFolder");
    if (!sel) return;

    /* Hanya folder dengan server aktif */
    const list = folders.filter(f =>
        (f.lang === "en" ? "en" : "id") === activeServer
    );

    if (list.length === 0) {
        sel.innerHTML = `<option value="">(Belum ada folder di server ini)</option>`;
        return;
    }

    sel.innerHTML = list.map(f => {
        const count = users.filter(u => u.folderId === f.id).length;
        const disabled = count >= MAX_USERS_PER_FOLDER ? "disabled" : "";
        const label = f.name +
            " (" + count + "/" + MAX_USERS_PER_FOLDER + ")" +
            (count >= MAX_USERS_PER_FOLDER ? " — PENUH" : "");
        return `<option value="${f.id}" ${disabled}>${escapeHtml(label)}</option>`;
    }).join("");

    if (selectedId) sel.value = selectedId;
}

function openAddUser() {

    if (!folders.length) {
        showToast("Belum ada folder", "error");
        return;
    }

    const count = users.filter(u => u.folderId === activeFolderId).length;
    if (count >= MAX_USERS_PER_FOLDER) {
        showToast("Folder penuh (maks 6 user).", "error");
        return;
    }

    document.getElementById("modalTitle").textContent = "Tambah User";
    document.getElementById("editId").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("inValue").value = "";
    document.getElementById("followers").value = "0";
    document.getElementById("name").value = "";
    document.getElementById("duration").value = "1";

    refreshFolderSelect(activeFolderId);
    document.getElementById("userModal").classList.add("show");
}

function closeModal() {
    document.getElementById("userModal").classList.remove("show");
}

function editUser(id) {

    const u = users.find(x => x.id === id);
    if (!u) return;

    document.getElementById("modalTitle").textContent = "Edit User";
    document.getElementById("editId").value = u.id;
    document.getElementById("email").value = u.email || "";
    document.getElementById("password").value = u.password || "";
    document.getElementById("inValue").value = u.inValue || "";
    document.getElementById("followers").value = u.followers || 0;
    document.getElementById("name").value = u.name || u.deviceId || "";

    const durDays = Number(u.timer.durationDays) || 1;
    const sel = document.getElementById("duration");
    const opts = Array.from(sel.options).map(o => Number(o.value));
    const closest = opts.reduce((a, b) =>
        Math.abs(b - durDays) < Math.abs(a - durDays) ? b : a
    );
    sel.value = String(closest);

    refreshFolderSelect(u.folderId);
    document.getElementById("userModal").classList.add("show");
}

async function saveUser() {

    const id        = document.getElementById("editId").value;
    const targetFolderId = document.getElementById("userFolder").value;
    const email     = document.getElementById("email").value.trim();
    const password  = document.getElementById("password").value;
    const inValue   = document.getElementById("inValue").value.trim();
    const followers = Number(document.getElementById("followers").value) || 0;
    const name      = document.getElementById("name").value.trim();
    const durationDays = Number(document.getElementById("duration").value) || 1;

    const durationSeconds = durationDays * SECONDS_PER_DAY;

    if (!email) {
        showToast("Email wajib diisi", "error");
        return;
    }

    if (!targetFolderId) {
        showToast("Folder tujuan wajib dipilih", "error");
        return;
    }

    if (id) {

        const u = users.find(x => x.id === id);
        if (!u) return;

        if (targetFolderId !== u.folderId) {
            const targetCount = users.filter(x => x.folderId === targetFolderId).length;
            if (targetCount >= MAX_USERS_PER_FOLDER) {
                showToast("Folder tujuan penuh (maks 6 user)", "error");
                return;
            }
        }

        u.folderId  = targetFolderId;
        u.email     = email;
        u.password  = password;
        u.inValue   = inValue;
        u.followers = followers;
        u.name      = name;
        u.deviceId  = name;

        if (u.timer.status !== "running") {
            u.timer.durationDays    = durationDays;
            u.timer.durationSeconds = durationSeconds;
            u.timer.remainingSeconds = durationSeconds;
            u.timer.remainingMs     = durationSeconds * 1000;
            u.timer.endAt           = null;

            if (u.timer.status === "expired") u.timer.status = "idle";
        }

    } else {

        const count = users.filter(x => x.folderId === targetFolderId).length;
        if (count >= MAX_USERS_PER_FOLDER) {
            showToast("Folder penuh (maks 6 user)", "error");
            return;
        }

        const now = Date.now();

        users.push({
            id: "u_" + now.toString(36) +
                Math.random().toString(36).slice(2, 7),
            folderId: targetFolderId,
            email,
            password,
            inValue,
            followers,
            name,
            deviceId: name,
            timer: {
                status: "idle",
                durationDays,
                durationSeconds,
                remainingSeconds: durationSeconds,
                remainingMs: durationSeconds * 1000,
                endAt: null,
                startedAt: null
            }
        });
    }

    closeModal();
    render();
    renderFolders();
    updateStats();
    await saveData();
}

function askDeleteUser(id) {
    document.getElementById("deleteTitle").textContent = "Hapus User?";
    document.getElementById("deleteText").textContent =
        "Data user akan dihapus dari JSONBin.";
    document.getElementById("deleteId").value = id;
    document.getElementById("deleteType").value = "user";
    document.getElementById("deleteModal").classList.add("show");
}

function closeDelete() {
    document.getElementById("deleteModal").classList.remove("show");
}

async function confirmDelete() {

    const id = document.getElementById("deleteId").value;
    const type = document.getElementById("deleteType").value;

    closeDelete();

    if (type === "folder") {
        await deleteFolder(id);
    } else {
        users = users.filter(u => u.id !== id);
        revealedPasswords.delete(id);
        render();
        renderFolders();
        updateStats();
        await saveData();
    }
}


/* =========================================================
   COPY / REVEAL
   ========================================================= */

function copyText(text, btnEl) {

    const value = String(text ?? "");

    const done = () => {
        if (btnEl) {
            const old = btnEl.textContent;
            btnEl.textContent = "✓";
            btnEl.disabled = true;
            setTimeout(() => {
                btnEl.textContent = old;
                btnEl.disabled = false;
            }, 1000);
        }
        showToast("Copied", "success");
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done).catch(() => {
            fallbackCopy(value, done);
        });
    } else {
        fallbackCopy(value, done);
    }
}

function fallbackCopy(value, done) {
    try {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
    } catch {
        showToast("Gagal menyalin", "error");
    }
}

function toggleReveal(id) {
    if (revealedPasswords.has(id)) revealedPasswords.delete(id);
    else revealedPasswords.add(id);
    render();
}


/* =========================================================
   STATS — hanya server aktif
   ========================================================= */

function updateStats() {

    const activeFolderIds = new Set(
        folders.filter(f => (f.lang === "en" ? "en" : "id") === activeServer)
               .map(f => f.id)
    );
    const target = users.filter(u => activeFolderIds.has(u.folderId));

    let running = 0, expired = 0;
    target.forEach(u => {
        const s = getStatus(u);
        if (s === "running") running++;
        if (s === "expired") expired++;
    });

    document.getElementById("totalFolders").textContent = activeFolderIds.size;
    document.getElementById("totalUsers").textContent   = target.length;
    document.getElementById("runningUsers").textContent = running;
    document.getElementById("expiredUsers").textContent = expired;
}


/* =========================================================
   ICON KONEKSI
   ========================================================= */

function setConnStatus(type) {

    const el = document.getElementById("connIcon");
    if (!el) return;

    el.classList.remove("ok", "err", "loading");
    el.classList.add(type);

    let title = "Connecting...";
    let color = "#f59e0b";

    if (type === "ok") {
        title = "Connected";
        color = "#22c55e";
    } else if (type === "err") {
        title = "Disconnected";
        color = "#ef4444";
    }

    el.title = title;

    const svg = el.querySelector("svg");
    if (svg) svg.setAttribute("stroke", color);
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimeout;

function showToast(message, type = "") {

    const toast = document.getElementById("toast");
    if (!toast) return;

    toast.textContent = message;
    toast.className = "toast show " + type;

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
    }, 2800);
}


/* =========================================================
   HELPERS
   ========================================================= */

function formatNumber(n) {
    return Number(n || 0).toLocaleString("id-ID");
}

function formatHHMMSS(totalSeconds) {

    totalSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));

    const hours   = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0")
    );
}

function formatDurationLabel(days) {
    const d = Number(days) || 1;
    if (Number.isInteger(d)) return d + " hari";
    return d.toFixed(1) + " hari";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
}

loadData();
startTickLoop();
